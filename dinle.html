details[open]>summary{border-bottom:2px solid var(--vurgu)}
.ic{display:flex;flex-direction:column;gap:10px;padding:12px}
.k{border:1px solid var(--cizgi);border-left:5px solid var(--vurgu);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px;background:var(--bg)}
.k.sec{outline:3px solid var(--vurgu);outline-offset:2px}
.ust{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.harf{background:var(--vurgu);color:var(--vurgu-yazi);font-weight:700;border-radius:6px;padding:1px 9px}
.k h3{margin:0;font-size:17px;flex:1;min-width:140px}
.ay{color:var(--ince);font-weight:700;font-size:15px}
.oyn{display:flex;align-items:center;gap:10px}
.cal{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--vurgu);color:var(--vurgu-yazi);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.cubuk{flex:1;min-width:0;height:28px;accent-color:var(--vurgu)}
.sure-yazi{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--ince);min-width:92px;text-align:right}
.not{font-size:14px;color:var(--ince);text-align:center;font-weight:600;margin:0}
.not a{color:var(--vurgu);font-weight:700}
.hata{color:#B3261E;font-weight:700;font-size:14px}
@media (prefers-color-scheme:dark){.hata{color:#FFB4AB}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

const L=document.getElementById("liste"),ses=new Audio();ses.preload="none";
let cal=null;          /* çalan kesit: {el, segs, i} */
let dosya="";          /* ses öğesine yüklü dosya */
const kartlar=new Map();/* kimlik → {el, segs, toplam} */
const sn=t=>{t=Math.max(0,Math.round(t));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
const sadele=s=>s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ’'‘]/g,"").replace(/ı/g,"i");

function kur(d){                                   /* surenin kesit kartlarını ilk açılışta üretir */
  const [n,,,ks]=d,ic=d.el.querySelector(".ic");if(ic.childElementCount)return;
  ks.forEach(([id,h,a,t,segs])=>{
    const toplam=segs.reduce((x,s)=>x+s[2]-s[1],0),k=document.createElement("div");k.className="k";k.id="s"+n+id;
    k.innerHTML=`<div class="ust"><span class="harf">${h}</span><h3>${t}</h3><span class="ay">${a}. ayet${a.includes("-")?"ler":""}</span></div>
<div class="oyn"><button class="cal" type="button" aria-label="Oynat: ${t}">▶</button><input class="cubuk" type="range" min="0" max="${toplam.toFixed(1)}" step="0.1" value="0" aria-label="Kesit içinde konum"><span class="sure-yazi">0:00 / ${sn(toplam)}</span></div>`;
    const o={el:k,segs,toplam,sure:d,dug:k.querySelector(".cal"),cub:k.querySelector(".cubuk"),yaz:k.querySelector(".sure-yazi")};
    kartlar.set(k.id,o);
    o.dug.addEventListener("click",()=>{if(cal&&cal.o===o){ses.paused?ses.play().catch(()=>hata(o)):ses.pause();}else baslat(o,0);});
    o.cub.addEventListener("input",()=>{const v=+o.cub.value;if(cal&&cal.o===o)git(o,v,!ses.paused);else{o.yaz.textContent=sn(v)+" / "+sn(o.toplam);o.bekleyen=v;}});
    ic.appendChild(k);
  });
}
function goster(o,gecen){o.cub.value=gecen;o.yaz.textContent=sn(gecen)+" / "+sn(o.toplam);}
function dugme(){kartlar.forEach(o=>{const b=cal&&cal.o===o&&!ses.paused;o.dug.textContent=b?"❚❚":"▶";o.dug.setAttribute("aria-label",(b?"Duraklat: ":"Oynat: ")+o.el.querySelector("h3").textContent);});}
function hata(o){const k=o.el;if(!k.querySelector(".hata")){const p=document.createElement("div");p.className="hata";p.textContent="Ses çalınamadı; bağlantıyı denetleyip yeniden deneyin.";k.appendChild(p);}}
function baslat(o,gecen){if(cal&&cal.o!==o)goster(cal.o,0);const v=o.bekleyen||gecen;o.bekleyen=0;const e=o.el.querySelector(".hata");if(e)e.remove();git(o,v,true);}
function git(o,gecen,oynat){                        /* kesit içindeki saniyeye gider; gerekirse ses dosyasını değiştirir */
  let i=0,kalan=gecen;while(i<o.segs.length-1&&kalan>=o.segs[i][2]-o.segs[i][1]){kalan-=o.segs[i][2]-o.segs[i][1];i++;}
  const [f,bas,son]=o.segs[i],t=Math.min(bas+kalan,son-0.05),jeton=(cal?cal.jeton:0)+1;
  cal={o,i,jeton};
  const hazir=()=>{if(!cal||cal.jeton!==jeton)return;try{ses.currentTime=t;}catch(e){}if(oynat)ses.play().catch(()=>hata(o));dugme();};
  if(dosya!==f){dosya=f;ses.src="ses/"+f+".webm";ses.addEventListener("loadedmetadata",hazir,{once:true});ses.load();}else hazir();
  goster(o,gecen);
}
function izle(){
  if(!cal||ses.seeking)return;const o=cal.o,[,bas,son]=o.segs[cal.i],t=ses.currentTime;
  const once=o.segs.slice(0,cal.i).reduce((x,s)=>x+s[2]-s[1],0);
  if(t>=son-0.04||ses.ended){
    if(cal.i<o.segs.length-1){git(o,once+(son-bas)+0.01,true);return;}
    ses.pause();goster(o,0);const sira=o.sure[3],j=sira.findIndex(k=>"s"+o.sure[0]+k[0]===o.el.id),sonraki=sira[j+1];cal=null;dugme();
    if(sonraki){const y=kartlar.get("s"+o.sure[0]+sonraki[0]);if(y)baslat(y,0);}
    return;
  }
  if(t>=bas-0.5)goster(o,Math.min(o.toplam,once+Math.max(0,t-bas)));
}
ses.addEventListener("timeupdate",izle);ses.addEventListener("ended",izle);
ses.addEventListener("play",dugme);ses.addEventListener("pause",dugme);
ses.addEventListener("error",()=>{if(cal)hata(cal.o);dosya="";dugme();});
setInterval(()=>{if(cal&&!ses.paused)izle();},60);   /* timeupdate seyrek gelir; kesit sonu tam yakalansın */

D.forEach(d=>{const [n,ad,ar,ks]=d,e=document.createElement("details");e.id="s"+n;d.el=e;d.anahtar=sadele(n+" "+ad);
  e.innerHTML=`<summary><span class="no">${n}</span><span class="ad">${ad}</span><span class="say">${ks.length} kesit</span><span class="arb" lang="ar" dir="rtl">${ar}</span></summary><div class="ic"></div>`;
  e.addEventListener("toggle",()=>{if(e.open)kur(d);});L.appendChild(e);});
document.getElementById("ara").addEventListener("input",e=>{const q=sadele(e.target.value.trim());D.forEach(d=>{d.el.hidden=!!q&&!d.anahtar.includes(q);});});

function adres(){                                   /* #s2C → Bakara açılır, C kesiti seçilir */
  const h=decodeURIComponent((location.hash||"").slice(1)),m=h.match(/^s(\d+)(.*)$/);if(!m)return;
  const d=D.find(x=>x[0]===+m[1]);if(!d)return;d.el.hidden=false;d.el.open=true;kur(d);
  kartlar.forEach(o=>o.el.classList.toggle("sec",o.el.id===h));
  const hedef=document.getElementById(h)||d.el;requestAnimationFrame(()=>hedef.scrollIntoView({block:"start"}));
}
addEventListener("hashchange",adres);adres();
</script>
