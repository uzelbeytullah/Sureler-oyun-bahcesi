function quiz({title,items,build,star,need=0.8,bitince,geri}){
  const V=$("view");let i=0,dogru=0;if(star&&items.length>sv().soru)items=items.slice(0,sv().soru);
  function step(){
    if(i>=items.length){const oran=dogru/items.length;if(star&&oran>=need)giveStar(star);if(bitince)bitince(dogru,items.length);
      V.innerHTML=`<div class="result pop"><h2>${title} bitti</h2><b class="big">${dogru} / ${items.length}</b>
      <p>${!star?"Güzel çalışma.":oran>=need?"Çok güzel, yıldızı hak ettin.":"Yıldız için en az %"+Math.round(need*100)+" doğru gerekiyor. Bir daha dene."}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="primary" id="again">${geri?"Geri dön":"Yeniden oyna"}</button></div></div>`;
      $("again").onclick=()=>geri?geri():show(cur);return;}
    const q=build(items[i]);
    V.innerHTML=`<div class="qhead"><span>${title}</span><span>${i+1} / ${items.length} · Doğru: ${dogru}</span></div>
    <div class="bar"><i style="width:${i/items.length*100}%"></i></div>${q.html}
    <div class="opts ${q.arOpts?"ar-opts":""}" ${q.tek?'style="grid-template-columns:1fr"':""} ${q.buyuk?'data-buyuk="1"':""}>${q.opts.map((o,j)=>`<button data-j="${j}" ${q.arOpts?'lang="ar"':""}>${esc(o)}</button>`).join("")}</div><p class="feedback" id="fb"></p>`;
    sesliSoru(q,V);
    V.querySelectorAll(".opts button[data-j]").forEach(b=>b.onclick=()=>{
      const ok=q.opts[+b.dataset.j]===q.answer;
      V.querySelectorAll(".opts button[data-j]").forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.j]===q.answer)x.classList.add("ok");});
      if(!ok)b.classList.add("bad");if(ok)dogru++;if(q.sonuc)q.sonuc(ok);if(!ok&&!q.sonuc&&q.opts.length>1)yanlisEkle(q);answer(ok);
      const fb=$("fb");fb.className="feedback "+(ok?"ok":"bad");
      fb.textContent=ok?(S.ardarda>=3?"Doğru! Art arda "+S.ardarda+" doğru, ek puan":"Doğru!"):"Doğrusu: "+q.answer;
      if(q.aciklama){const p=document.createElement("div");p.className="detay";p.innerHTML=`<p>${esc(q.aciklama)}</p><button class="primary" id="devam">Devam</button>`;fb.after(p);$("devam").onclick=()=>{i++;step();};$("devam").focus();}
      else setTimeout(()=>{i++;step();},ok?900:1700);});
  }
  step();
}
function secenek(dogru,havuz,adet){if(adet===undefined)adet=sv().sik;const h=shuffle([...new Set(havuz.filter(x=>x&&x!==dogru))]).slice(0,adet);return shuffle([dogru,...h]);}
function kelime(){
  const seen=new Set(),all=[];
  CUR.ayetler.forEach(a=>a.w.forEach(w=>{const k=w.a+"|"+w.tr;if(!seen.has(w.a)){seen.add(w.a);all.push(w);}}));
  const anlamlar=all.map(w=>w.tr);
  quiz({title:kucuk()?"Dinle ve seç":"Kelime eşleştir",star:"kelime",items:shuffle(all).slice(0,10),
    build:w=>{const o=secenek(w.tr,anlamlar);return {html:`<p>Bu kelimenin anlamı nedir?</p><div class="qbig ar" lang="ar">${w.a}</div><p class="okunus">${esc(w.ok)}</p>`,answer:w.tr,opts:o,sonuc:ok=>defterIsle(CUR.no,w,o,ok)};}});
}
function tamamla(){
  const tum=[...new Set(CUR.ayetler.flatMap(a=>a.w.map(w=>w.a)))];
  let sec;
  if(CUR.ayetler.length>=10)sec=shuffle(CUR.ayetler.map((a,i)=>i)).slice(0,10).map(ai=>({ai,k:Math.floor(Math.random()*CUR.ayetler[ai].w.length)}));
  else{const t=[];CUR.ayetler.forEach((a,ai)=>a.w.forEach((_,k)=>t.push({ai,k})));sec=shuffle(t).slice(0,10);}
  quiz({title:"Ayet tamamla",star:"tamamla",items:sec,
    build:({ai,k})=>{const a=CUR.ayetler[ai];const hedef=a.w[k].a;
      const satir=a.w.map((w,j)=>j===k?'<span class="blank">؟</span>':w.a).join(" ");
      return{html:`<p>${CUR.ayetler.length===1?"Ayetteki":((CUR.ilkAyet||1)+ai)+". ayetteki"} boşluğa hangi kelime gelir?</p><div class="ayet-box ar" lang="ar">${satir}</div><p class="okunus">${esc(a.meal)}</p>`,answer:hedef,arOpts:true,opts:secenek(hedef,tum)};}});
}
function bilgi(){

function sirala(){
  const V=$("view");const CM=!!CUR.cumleler;
  const A=CM?CUR.cumleler.map(c=>({ar:CUR.ayetler[0].w.slice(c.bas,c.son).map(w=>w.a)})):CUR.ayetler;const BLOK=CM?A.length:7;
  const basI=A.length<=BLOK?0:Math.floor(Math.random()*(A.length-BLOK+1));
  const idx=A.map((_,i)=>i).slice(basI,basI+Math.min(BLOK,A.length));
  let order=shuffle(idx);let dene=0;while(order.every((v,i)=>v===idx[i])&&dene++<20)order=shuffle(idx);
  function draw(sonuc){
    V.innerHTML=`<h2>${CM?"Cümleleri sırala":"Ayetleri sırala"}</h2><p>${CM?"Ayetin on cümlesini doğru sıraya diz. ":""}${A.length>BLOK?`Bu turda ${basI+1}-${basI+idx.length}. ayetler var. `:""}Ayetleri tutup sürükleyerek doğru sıraya diz. Farede satırın her yerinden, telefonda soldaki ⠿ tutamağından tut. Oklarla da taşıyabilirsin.</p>
    <div class="order-list">${order.map((ai,pos)=>`<div class="order-item ${sonuc?(ai===idx[pos]?"ok":"bad"):""}" data-ai="${ai}">
      <span class="grip" aria-hidden="true"><span class="num">${pos+1}</span><span class="dots">⠿</span></span><span class="ar" lang="ar">${A[ai].ar.join(" ")}</span>
      <span class="mv"><button aria-label="Yukarı taşı" data-u="${pos}" ${pos===0?"disabled":""}>▲</button><button aria-label="Aşağı taşı" data-d="${pos}" ${pos===order.length-1?"disabled":""}>▼</button></span></div>`).join("")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="kontrol">Kontrol et</button>${A.length>BLOK?`<button id="yeni">Başka ayetlerle oyna</button>`:""}</div><p class="feedback" id="fb"></p>`;
    V.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const p=+b.dataset.u;[order[p-1],order[p]]=[order[p],order[p-1]];draw();});
    V.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const p=+b.dataset.d;[order[p+1],order[p]]=[order[p],order[p+1]];draw();});
    const list=V.querySelector(".order-list");
    list.querySelectorAll(".order-item").forEach(it=>{
      it.addEventListener("pointerdown",e=>{
        if(e.target.closest("button"))return;
        if(e.pointerType!=="mouse"&&!e.target.closest(".grip"))return;
        if(e.pointerType==="mouse"&&e.button!==0)return;
        e.preventDefault();it.setPointerCapture(e.pointerId);it.classList.add("drag");
        let startY=e.clientY;
        const move=ev=>{it.style.transform=`translateY(${ev.clientY-startY}px)`;
          for(const o of [...list.children].filter(x=>x!==it)){const r=o.getBoundingClientRect(),mid=r.top+r.height/2,ir=it.getBoundingClientRect(),myMid=ir.top+ir.height/2;
            const before=it.compareDocumentPosition(o)&Node.DOCUMENT_POSITION_PRECEDING;
            if((before&&myMid<mid)||(!before&&myMid>mid)){const t0=it.getBoundingClientRect().top;list.insertBefore(it,before?o:o.nextSibling);startY+=it.getBoundingClientRect().top-t0;it.style.transform=`translateY(${ev.clientY-startY}px)`;break;}}};
        const up=()=>{it.removeEventListener("pointermove",move);it.removeEventListener("pointerup",up);it.removeEventListener("pointercancel",up);
          it.style.transform="";it.classList.remove("drag");order=[...list.children].map(x=>+x.dataset.ai);draw();};
        it.addEventListener("pointermove",move);it.addEventListener("pointerup",up);it.addEventListener("pointercancel",up);
      });
    });
    const y=$("yeni");if(y)y.onclick=()=>sirala();
    $("kontrol").onclick=()=>{const ds=order.filter((ai,p)=>ai===idx[p]).length;const tam=ds===order.length;
      answer(tam);draw(true);const fb=$("fb");
      if(tam){fb.className="feedback ok";fb.textContent="Tebrikler, sıra tamamen doğru!";giveStar("sirala");}
      else{fb.className="feedback bad";fb.textContent=ds+" ayet doğru yerde. Kırmızıları düzeltip yeniden kontrol et.";}};
  }
  draw();
}

  <h2>Beklenen davranış değişimleri</h2><ul style="margin:0;padding-left:20px">${Y.davranis_degisimleri.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;

  else ic=x.boyutlar.length?`<div class="sure-grid">${x.boyutlar.map(b=>`<div class="sure-kart" style="border:2px solid var(--line);border-radius:14px;cursor:default"><span class="sad" style="color:var(--gold)">${esc(b.ad)}</span><span>${esc(b.metin)}</span></div>`).join("")}</div>`:"<p>Bu ayet için kitapta boyut notu yok.</p>";

function efekt(tur){if(S.efekt===false)return;try{EFX=EFX||new (window.AudioContext||window.webkitAudioContext)();const c=EFX;if(c.state==="suspended")c.resume();
  const N={dogru:[[660,0,.09],[880,.09,.14]],yanlis:[[220,0,.22]],seri:[[523,0,.08],[659,.08,.08],[784,.16,.08],[1047,.24,.18]],yildiz:[[784,0,.1],[988,.1,.1],[1175,.2,.1],[1568,.3,.3]],gorev:[[523,0,.12],[784,.12,.12],[1047,.24,.3]],satin:[[880,0,.06],[1320,.07,.12]]}[tur]||[];

    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(tur==="yanlis"?0.18:0.22,s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+0.02);});}catch(e){}}

  shuffle(CUR.ayetler.map((a,i)=>i)).slice(0,3).forEach(ai=>{const a=CUR.ayetler[ai],k=Math.floor(Math.random()*a.w.length),h=a.w[k].a;
    Q.push({html:`<p>Boşluğa hangi kelime gelir?</p><div class="ayet-box ar" lang="ar">${a.w.map((w,j)=>j===k?'<span class="blank">؟</span>':w.a).join(" ")}</div>`,dogru:h,opts:secenek(h,tum,3),ar:true});});
  return shuffle(Q);}
function yarSkor(){return Object.entries(YAR.puan).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<li><b>${esc(YAR.ad[p]||"Oyuncu")}</b> · ${n} puan</li>`).join("")||"<li>Henüz katılan yok</li>";}
async function yarAc(){const V=$("view"),oda=await odaAl();
  if(!oda){V.innerHTML=`<p>Canlı yarışma bu görünümde açılamıyor. Sayfayı claude.ai üzerinden açman gerekir.</p><button class="geri" id="yG">← Geri</button>`;$("yG").onclick=()=>show("harita");return;}
  const kod=String(Math.floor(1000+Math.random()*9000));let R;try{R=await oda.join("yaris-"+kod);}catch(e){toast("Oda açılamadı");return;}
  YAR={kod,R,host:true,Q:yarSorular(),i:-1,durum:"bekle",puan:{},ad:{},cevap:{},sure:CUR.ad};
  R.onPeers(()=>{R.peers().forEach(p=>{if(p.isMe)return;const pr=p.presence||{};if(pr.ad){YAR.ad[p.peer]=pr.ad;if(YAR.puan[p.peer]===undefined)YAR.puan[p.peer]=0;}
    if(pr.c&&YAR.durum==="soru"&&pr.c.q===YAR.i&&YAR.cevap[p.peer]===undefined)YAR.cevap[p.peer]=pr.c.j;});yarCiz();});
  YAR.tik=setInterval(()=>{if(YAR&&YAR.host)yarYay();},2500);yarCiz();}
function yarYay(){const Y=YAR,q=Y.Q[Y.i];Y.R.emit("durum",{kod:Y.kod,sure:Y.sure,durum:Y.durum,i:Y.i,n:Y.Q.length,html:q?q.html:"",opts:q?q.opts:[],ar:q?!!q.ar:false,dogru:Y.durum==="sonuc"&&q?q.dogru:null,skor:Object.entries(Y.puan).map(([p,n])=>[Y.ad[p]||"Oyuncu",n,p])}).catch(()=>{});}
function yarCiz(){const Y=YAR,V=$("view");if(!Y||!Y.host)return;const q=Y.Q[Y.i];const cevapSay=Object.keys(Y.cevap).length,oyuncu=Object.keys(Y.ad).length;
  V.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="geri" id="yKapat">← Yarışmayı kapat</button></div>
  <h2>👪 Aile yarışması · ${esc(Y.sure)}</h2>
  <p style="font-size:20px">Katılım kodu: <b style="font-size:40px;letter-spacing:6px">${Y.kod}</b></p>
  <p>Oyuncular bu sayfayı kendi telefonlarında açıp ana sayfadaki <b>Aile yarışmasına katıl</b> düğmesine basar ve kodu yazar.</p>
  ${Y.durum==="bekle"?`<p><b>${oyuncu} oyuncu katıldı.</b></p><button class="primary" id="yBasla" ${oyuncu?"":"disabled"} style="font-size:20px">Başlat</button>`:""}
  ${q&&Y.durum!=="bitti"?`<div class="qhead"><span>Soru ${Y.i+1} / ${Y.Q.length}</span><span>${cevapSay} / ${oyuncu} cevap</span></div>${q.html}
   <div class="opts ${q.ar?"ar-opts":""}">${q.opts.map(o=>`<button disabled ${q.ar?'lang="ar"':""} class="${Y.durum==="sonuc"&&o===q.dogru?"ok":""}">${esc(o)}</button>`).join("")}</div>
   ${Y.durum==="soru"?`<button class="primary" id="yGoster">Cevabı göster</button>`:`<button class="primary" id="ySonraki">${Y.i+1<Y.Q.length?"Sonraki soru":"Sonuçlar"}</button>`}`:""}
  ${Y.durum==="bitti"?`<h2>Sonuç</h2>`:""}<h3>Puan tablosu</h3><ol style="font-size:19px">${yarSkor()}</ol>`;
  $("yKapat").onclick=()=>{clearInterval(Y.tik);Y.durum="bitti";yarYay();Y.R.leave().catch(()=>{});YAR=null;show("harita");};
  const b=$("yBasla");if(b)b.onclick=()=>{Y.i=0;Y.durum="soru";Y.cevap={};yarYay();yarCiz();efekt("seri");};
  const g=$("yGoster");if(g)g.onclick=()=>{Y.durum="sonuc";Object.entries(Y.cevap).forEach(([p,j])=>{if(q.opts[j]===q.dogru)Y.puan[p]=(Y.puan[p]||0)+10;});yarYay();yarCiz();efekt("dogru");};
  const s=$("ySonraki");if(s)s.onclick=()=>{if(Y.i+1<Y.Q.length){Y.i++;Y.durum="soru";Y.cevap={};}else{Y.durum="bitti";kutla();efekt("gorev");}yarYay();yarCiz();};}
async function yarKatil(){const V=$("view");CUR=null;baslik();setTabs();$("baslik").textContent="Aile yarışması";
  const oda=await odaAl();if(!oda){V.innerHTML=`<p>Canlı yarışma bu görünümde açılamıyor. Sayfayı claude.ai üzerinden açman gerekir.</p><button class="geri" id="yG">← Sureler</button>`;$("yG").onclick=()=>anaSayfa();return;}
  let ad="";try{ad=localStorage.getItem("yaris-ad")||"";}catch(e){}

  <p><label><b>Adın</b><br><input id="yAd" class="ara" value="${esc(ad)}" maxlength="20" placeholder="Adını yaz"></label></p>
  <p><label><b>Katılım kodu</b><br><input id="yKod" class="ara" inputmode="numeric" maxlength="4" placeholder="4 haneli kod"></label></p><button class="primary" id="yGir" style="font-size:20px">Katıl</button>`;
  $("yG").onclick=()=>anaSayfa();
  $("yGir").onclick=async()=>{const a=$("yAd").value.trim().slice(0,20),k=$("yKod").value.trim();if(!a||!/^\d{4}$/.test(k)){toast("Adını ve 4 haneli kodu yaz");return;}
    try{localStorage.setItem("yaris-ad",a);}catch(e){}
    let R;try{R=await oda.join("yaris-"+k);}catch(e){toast("Katılamadım, kodu denetle");return;}
    YAR={host:false,R,kod:k,ad:a,son:null,secim:{}};R.presence({ad:a}).catch(()=>{});
    V.innerHTML=`<h2>👪 ${esc(a)}, yarışmaya katıldın</h2><div id="yEkran"><p>Sunucunun başlatmasını bekliyoruz…</p></div><button class="geri" id="yCik">Yarışmadan çık</button>`;
    $("yCik").onclick=()=>{R.leave().catch(()=>{});YAR=null;anaSayfa();};
    R.on("durum",m=>{if(!YAR||YAR.host||m.isMe)return;yarOyuncuCiz(m.data||{});});};}
function yarOyuncuCiz(d){const Y=YAR,E=$("yEkran");if(!E)return;const imza=d.durum+"|"+d.i;const skor=(d.skor||[]).sort((a,b)=>b[1]-a[1]);
  const benim=skor.find(s=>s[2]===undefined);
  if(Y.son===imza&&d.durum!=="bekle")return;Y.son=imza;
  if(d.durum==="bekle"){E.innerHTML=`<p>Sunucunun başlatmasını bekliyoruz… (${esc(d.sure||"")})</p>`;return;}
  const tablo=`<h3>Puan tablosu</h3><ol style="font-size:18px">${skor.map(s=>`<li><b>${esc(s[0])}</b> · ${s[1]}</li>`).join("")}</ol>`;
  if(d.durum==="bitti"){E.innerHTML=`<h2>Yarışma bitti</h2>${tablo}`;kutla();return;}
  if(d.durum==="soru"){E.innerHTML=`<div class="qhead"><span>Soru ${d.i+1} / ${d.n}</span></div>${d.html}<div class="opts ${d.ar?"ar-opts":""}">${d.opts.map((o,j)=>`<button data-j="${j}" ${d.ar?'lang="ar"':""}>${esc(o)}</button>`).join("")}</div><p class="feedback" id="yFb"></p>`;
    E.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{Y.secim[d.i]=+b.dataset.j;E.querySelectorAll("[data-j]").forEach(x=>{x.disabled=true;});b.classList.add("on");$("yFb").textContent="Cevabın gönderildi";Y.R.presence({ad:Y.ad,c:{q:d.i,j:+b.dataset.j}}).catch(()=>{});});return;}
  if(d.durum==="sonuc"){const j=Y.secim[d.i],ok=j!==undefined&&d.opts[j]===d.dogru;efekt(ok?"dogru":"yanlis");if(ok)gorevIsle("soru");
    E.innerHTML=`${d.html}<div class="opts ${d.ar?"ar-opts":""}">${d.opts.map((o,k)=>`<button disabled ${d.ar?'lang="ar"':""} class="${o===d.dogru?"ok":k===j?"bad":""}">${esc(o)}</button>`).join("")}</div><p class="feedback ${ok?"ok":"bad"}"><b>${ok?"Doğru! +10":j===undefined?"Cevap vermedin":"Doğrusu: "+esc(d.dogru)}</b></p>${tablo}`;}}

/* --- ortak hedef --- */
async function hedefOku(){if(!DB)return [];try{const s=await DB.collection("hedef").get();return s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){return [];}}
async function hedefKatkilar(){if(!DB)return [];try{const s=await DB.collection("hedefk").get();return s.docs.map(d=>d.data());}catch(e){return [];}}
let hedefYazT=null;
function hedefIsle(tur){const H=S.hedefler||{};let deg=false;Object.entries(H).forEach(([kod,h])=>{if(h.tur===tur){h.n=(h.n||0)+1;deg=true;}});
  if(deg&&DB&&UID){clearTimeout(hedefYazT);hedefYazT=setTimeout(()=>{const v={};Object.entries(S.hedefler).forEach(([k,h])=>v[k]={n:h.n||0,ad:h.benimAd||""});DB.collection("hedefk").doc(UID).set({k:v}).catch(()=>{});},1500);}}
async function hedefSayfa(){CUR=null;baslik();setTabs();$("baslik").textContent="Ortak hedef";$("altbaslik").textContent="Aile ya da sınıfça birlikte ulaşılan hedef";
  const V=$("view");V.innerHTML=`<p class="yukleniyor">Yükleniyor…</p>`;
  if(!DB){V.innerHTML=`<button class="geri" id="hG">← Sureler</button><p>Ortak hedef için sayfanın claude.ai üzerinden açılması gerekir.</p>`;$("hG").onclick=()=>anaSayfa();return;}
  const yaz=USR_YAZ;
  const [L,K]=await Promise.all([hedefOku(),hedefKatkilar()]);const H=S.hedefler||{};
  const top=kod=>K.reduce((a,x)=>a+(((x.k||{})[kod]||{}).n||0),0),kisi=kod=>K.filter(x=>(x.k||{})[kod]).length;

  V.innerHTML=`<button class="geri" id="hG">← Sureler</button><h2>🤝 Ortak hedef</h2>
  <p>Aile ya da sınıf birlikte bir hedef koyar: örneğin "Bu hafta hep birlikte 100 ayet tekrarı". Herkesin katkısı toplanır; sıralama yoktur, hedefe birlikte ulaşılır.</p>
  ${yaz===false?`<p class="detay"><b>Bu sayfayı yalnız görüntüleyebiliyorsun.</b> Ortak hedefe katkı vermek için sayfanın sahibi seni paylaşım menüsünden <b>Katkıda bulunan</b> olarak eklemeli.</p>`:""}
  ${benim.map(h=>{const t=top(h.id),y=Math.min(100,Math.round(t/h.hedef*100));return `<section class="detay"><h3>${esc(h.ad)}</h3><div class="bar" style="height:16px"><i style="width:${y}%"></i></div><p><b>${t} / ${h.hedef}</b> ${h.tur==="tekrar"?"ayet tekrarı":"doğru cevap"} · ${kisi(h.id)} kişi katıldı · Benim katkım: <b>${(H[h.id]||{}).n||0}</b> · Kod: <b>${h.id}</b>${t>=h.hedef?" · <b>Hedefe ulaşıldı, maşallah!</b>":""}</p></section>`;}).join("")||"<p>Henüz bir hedefe katılmadın.</p>"}
  <h3>Bir hedefe katıl</h3><p><input id="hKod" class="ara" maxlength="6" placeholder="Hedef kodu"> <button class="primary" id="hKatil">Katıl</button></p>

  <p style="display:flex;gap:8px;flex-wrap:wrap"><select id="hTur" style="min-height:44px;font-size:17px"><option value="tekrar">Ayet tekrarı</option><option value="soru">Doğru cevap</option></select><input id="hSay" type="number" min="10" max="10000" value="100" style="min-height:44px;width:120px;font-size:17px"><button class="primary" id="hKoy">Hedefi koy</button></p>`;

    S.hedefler=S.hedefler||{};S.hedefler[k]=S.hedefler[k]||{tur:h.tur,n:0};save();hedefIsle("-");toast("Hedefe katıldın");hedefSayfa();};
  $("hKoy").onclick=async()=>{const ad=$("hAd").value.trim(),n=Math.max(10,Math.min(10000,+$("hSay").value||100)),tur=$("hTur").value;if(!ad){toast("Hedefe bir ad ver");return;}

    S.hedefler=S.hedefler||{};S.hedefler[kod]={tur,n:0};save();toast("Hedef kondu. Kodu ailene ya da sınıfına ver: "+kod);hedefSayfa();};}
